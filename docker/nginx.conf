server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 后端地址每次请求时经 Docker 内置 DNS 解析：写死在 proxy_pass 里只在启动时解析一次，
    # 后端容器重启换了 IP 之后会一直 502；后端没起来时 nginx 也会启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /api/ask 是 SSE：不缓冲、不压缩，逐个事件转发；Agent 一次回答最长几十秒，读超时放宽
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # 单页应用：静态资源带哈希可长期缓存，其余路径都回到 index.html
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
