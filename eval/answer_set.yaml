- id: d1_table_01
  type: table
  doc: '1'
  expect: answer
  question: 'D型泵不吸水，而且真空表显示高度真空，可能是什么原因，怎么消除？'
  reference: '原因：底阀没打开或已淤塞；吸水管路的阻力太大；吸水高度太高。消除方法：校正或更换底阀；清洗或更换吸水管路；降低吸水高度。'
  facts:
    - say: 底阀没打开或已淤塞
      any: ['底阀']
    - say: 吸水管路阻力太大
      any: ['吸水管路.{0,8}阻力', '阻力(太|过)大']
    - say: 吸水高度太高
      any: ['吸水高度']
  evidence:
    - quote: '底阀没打开或已淤塞'

- id: d1_table_02
