- id: d1_cross_01
  type: cross_chunk
  doc: '1'
  expect: answer
  question: 'D型泵运转时水泵轴承的最高温度不应超过多少？如果轴承过热，常见原因有哪些？'
  reference: '水泵轴承最高温度不应超过75℃。轴承过热的原因：轴承内没有油；泵轴与电机轴不在同一中心线上。消除方法：检查并清洗轴承体、加润滑油；校正两轴的同心度。'
  facts:
    - say: 轴承最高温度不超过 75℃
      any: ['{n:75}{C}']
      numeric: true
    - say: 轴承内没有油
      any: ['没有油', '缺油', '无油', '加润滑油']
    - say: 泵轴与电机轴不在同一中心线上
      any: ['同一中心线', '同心度', '不同心']
  evidence:
    - quote: '水泵轴承最高温度不应超过75℃'
    - quote: '轴承内没有油'

- id: d1_coll_01
  type: colloquial
  doc: '1'
  expect: answer
  question: 'D型泵开起来抖得厉害，可能是哪儿出了毛病？'
  reference: '泵不正常振动的原因：泵发生了汽蚀；叶轮不平衡；泵轴与电机轴不同心；底脚螺钉松动。对应处理：调节出水闸阀使之在规定的性能范围内运转；叶轮校正静平衡；校正泵轴与电动机轴同心度；拧紧底脚螺钉。'
  facts:
    - say: 泵发生了汽蚀
      any: ['汽蚀']
    - say: 叶轮不平衡
      any: ['不平衡']
    - say: 泵轴与电机轴不同心
      any: ['不同心', '同心度']
    - say: 底脚螺钉松动
      any: ['螺钉松动', '底脚螺钉']
  evidence:
    - quote: '叶轮不平衡'

- id: d1_coll_02
  type: colloquial
  doc: '1'
  expect: answer
  question: 'D型泵要停很久不用，里面的水用不用放掉？'
  reference: '要放。长期停泵时应放空泵内积水，防止泵内生锈或结冰冻裂泵体，并每隔15天将转子旋转180度。'
  facts:
    - say: 放空泵内积水
      any: ['放空', '排空', '放掉', '放净', '排净']
    - say: 每隔 15 天将转子旋转 180 度
      any: ['{n:15}天']
      numeric: true
  evidence:
    - quote: '长期停泵时放空泵内积水'

