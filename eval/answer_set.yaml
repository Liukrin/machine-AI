  expect: answer
  question: 'D型卧式多级离心泵配套电动机的防护等级和绝缘等级分别是什么？'
  reference: '防护等级 IP44，绝缘等级 B（电压 380V、6kV 或 10kV，频率 50Hz，安装形式 B3）。'
  facts:
    - say: 防护等级 IP44
      any: ['ip44']
    - say: 绝缘等级 B
      any: ['绝缘等级[:为是]*b(?![a-z0-9])', 'b级绝缘']
  evidence:
    - quote: '防护等级：IP44；绝缘等级：B'

- id: d1_fact_03
  type: fact
  doc: '1'
  expect: answer
  question: 'D型泵启动前手动盘车有什么要求？'
  reference: '启动前必须手动盘车至少一圈，确认无卡磨现象后方可运转。'
  facts:
    - say: 至少盘车一圈
      any: ['至少(一|1)圈', '(一|1)圈以上']
    - say: 无卡磨现象
      any: ['卡磨', '卡滞', '摩擦']
  evidence:
    - quote: '启动前必须手动盘车至少一圈'

- id: d1_fact_05
  type: fact
  doc: '1'
  expect: answer
  question: 'D型泵润滑轴承用的锂基脂应该加多少？'
  reference: '用3#锂基脂，数量以占轴承体空间的1/3~1/2为宜。'
  facts:
    - say: 占轴承体空间的 1/3~1/2
      any: ['{n:1/3}{to}{n:1/2}', '三分之一.{0,4}二分之一']
      numeric: true
    - say: 3# 锂基脂
      any: ['3#锂基']
  evidence:
    - quote: '3#锂基脂的数量以占轴承体空间的1/3~1/2为宜'

- id: d1_fact_07
  type: fact
  doc: '1'
  expect: answer
  question: 'D型泵采用变频或软启动方式时，对启动时间和频率设置有什么要求？'
  reference: '从零转速到额定转速的时间要小于10~15秒；频率应固定设置，用泵出口阀门调节流量，防止频率变化引起扬程剧烈波动造成泵损坏。'
  facts:
    - say: 启动时间小于 10~15 秒
      any: ['{n:10}{to}{n:15}(秒|s)']
      numeric: true
    - say: 频率固定设置
      any: ['频率.{0,8}固定', '固定.{0,8}频率']
    - say: 用出口阀门调节流量
      any: ['阀门调节流量', '出口阀.{0,6}调节']
  evidence:
    - quote: '时间小于10~15秒'

- id: d1_fact_08
  type: fact
  doc: '1'
  expect: answer
  question: 'D型泵由自冲洗改为外冲洗结构时，冲洗水的压力应满足什么要求？'
  reference: '冲洗水压力应不小于泵进口压力+0.2MPa；如果泵为首级双吸结构，压力应不小于泵单级扬程+进口压力+0.2MPa。水质为清洁工业水。'
  facts:
    - say: 不小于泵进口压力 + 0.2MPa
      any: ['{n:0.2}mpa']
      numeric: true
    - say: 以泵进口压力为基准
      any: ['进口压力']
  evidence:
    - quote: '压力：≥泵进口压力+0.2MPa'

