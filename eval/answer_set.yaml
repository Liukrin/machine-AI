# 答案级评测集（机械设备运维知识问答 RAG 平台）
#
# 来源：由 Claude 通读四份手册的 MinerU 解析文本（data/chunks/chunks.jsonl）后逐条编写，
#       参考答案只取手册原文里写明的内容；经 src/answer_eval/validate.py 做证据与数值落地校验。
#       尚未经人工逐条复核——发现问题请直接改本文件，再跑一遍校验脚本。
# 与 eval/qa_set.jsonl 的关系：那 36 题只标了 gold chunk、且被用来标定拒答阈值 τ；
#       本文件的问题全部重新编写，不复用那 36 题的问句，可独立衡量误拒。
# dev / test 划分不写在这里，见 eval/answer_set_split.json（由 validate.py --assign 生成后冻结）。
#
# 字段：
#   id        稳定标识，不要改
#   type      fact 正文事实/参数 | procedure 步骤 | table 表格查询 | cross_chunk 答案跨多个片段
#             colloquial 口语化提问 | multi_turn 多轮追问
#             oos_adjacent 相近领域但库里没有 | oos_in_domain 与这些泵有关但手册未写 | oos_unrelated 无关
#   doc       期望依据的手册（doc_id）；跨手册题写列表
#   expect    answer 应当作答 | refuse 应当拒答或说明资料不足
#   question  发给系统的问句；multi_turn 题另有 history（前文）和 standalone（不依赖前文的改写）
#   reference 参考答案（依据手册原文）
#   facts     关键事实列表。say 是给人看的说明；any 是一组正则（任一命中即算答出），
#             作用在归一化后的答案上（全角转半角、去空白、小写、℃→°c、m³→m3，见 textnorm.norm）；
#             可用宏：{n:0.1} 有边界的数字，{to} 范围连接符，{mm} {C} {F} {in} 单位。
#             numeric: true 表示这是数值事实，计入「数值准确率」，其数字必须能在证据原文里找到；
#             src 用于原文数字被解析弄乱时，给出原文里的实际写法。
#   evidence  证据：quote 是手册原文里的一段话（表格写成单元格用空格隔开），评测时解析成包含它的
#             chunk_id；any_quote 是几种等价写法。多条 evidence 表示答案需要多个片段。
#   absent    （拒答题）语料里不应出现的词，校验脚本会检查；absent_in 限定只查某份手册。

# ============================================================================ 手册 1：D/MD/DF 型多级离心泵

- id: d1_fact_01
  type: fact
  doc: '1'
  expect: answer
  question: 'MD型煤矿用耐磨多级离心泵对输送的矿井水有什么限制？'
  reference: '用于输送固体颗粒含量（体积浓度）不大于1.5%、粒径小于0.5mm、温度不高于80℃的中性矿井水或其它类似的污水。'
  facts:
    - say: 固体颗粒体积浓度不大于 1.5%
      any: ['{n:1.5}%']
      numeric: true
    - say: 粒径小于 0.5mm
      any: ['{n:0.5}{mm}']
      numeric: true
    - say: 温度不高于 80℃
      any: ['{n:80}{C}']
      numeric: true
  evidence:
    - quote: '固体颗粒含量(体积浓度)不大于1.5%'

- id: d1_fact_02
  type: fact
