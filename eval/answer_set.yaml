- id: d1_proc_01
  type: procedure
  doc: '1'
  expect: answer
  question: 'D型多级离心泵停止运转时应按什么顺序操作？'
  reference: '先关闭真空表及压力表的阀门和出水管路上的闸阀，然后切断电动机的电源；如所处环境温度较低，应将泵体下部的丝堵打开，放掉剩水，以免冻裂。'
  facts:
    - say: 先关闭仪表阀门和出水闸阀
      any: ['关闭.{0,30}闸阀', '闸阀.{0,10}关闭']
    - say: 再切断电动机电源
      any: ['切断.{0,10}电源', '断电', '断开.{0,6}电源']
    - say: 低温时打开丝堵放掉剩水
      any: ['丝堵', '剩水', '放.{0,4}(积水|存水)']
  evidence:
    - quote: '要先关闭真空表及压力表的阀门和出水管路上的闸阀'

- id: d1_proc_02
  type: procedure
  doc: '1'
  expect: answer
  question: 'D型泵起动时，出水闸阀和真空表、压力表的阀门应该怎么操作？'
  reference: '先关闭出水闸阀并向泵内注满水；起动电动机前关闭真空表及压力表与泵相连接的阀门，待转速正常后再打开仪表阀门，然后再打开出水闸阀；出口阀关闭时间不宜过长，否则容易使泵体发热而损坏。'
  facts:
    - say: 起动前关闭出水闸阀
      any: ['关闭出水闸阀', '出水闸阀.{0,6}关闭']
    - say: 转速正常后再打开
      any: ['转速正常']
    - say: 出口阀关闭时间不宜过长
      any: ['不宜过长', '不能过长', '不可过长', '发热']
  evidence:
    - quote: '待转速正常后再打开'

