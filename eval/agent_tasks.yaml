# Agent 多步任务集：考查「查到 → 再加工」的能力，而不只是把原文找出来。
#
# 与主评测集（eval/answer_set.yaml）字段相同，另有两处扩展：
#   tools     期望用到的工具（只作统计，不计入对错）：search_manuals / lookup_table / read_section /
#             convert_unit / check_value，见 src/s4_agent/tools.py
#   calc      推算数值事实（换算结果、差值）的算式。这类数字不在手册原文里，validate.py 改为核对
#             模式里每个 {n:…} 都是 calc 算式结果的正确舍入；算式里的换算系数在这里独立写出，
#             不依赖 Agent 的换算工具，工具算错了评测能发现。
#
# 题型：convert 单位换算 | check 限值核对（实测值是否在手册规定范围内）| table_lookup 表格精确查询
#      | multi_step 多步/跨手册 | oos_in_domain 手册没写的参数（应说明查不到，不得编造限值）
#
# 结论用语的正则（「超出」「合格」）在第一次出现时用 YAML 锚点定义（&exceed / &within），后面的题复用。
# 作用在归一化后的答案上（全角转半角、去空白、小写、℃→°c，见 textnorm.norm）。
#   exceed：超过了规定、不合格、不在范围内……；带否定前缀的「未超过」「不应超过」不算
#   within：合格、符合、满足、在范围内、未超过……；「不合格」「是否合格」不算
#
# 换算系数（calc 用）：1 m³/h = 1000/60 L/min；1 bar = 14.5037738 psi；1 kgf/cm² = 0.0980665 MPa；
#   1 psi = 0.00689476 MPa；1 ft = 0.3048 m；1 kgf·m = 9.80665 N·m；1 lbf·ft = 0.138255 kgf·m；°F = °C×9/5+32

# ============================================================================ 单位换算

- id: cv_01
  type: convert
  doc: '2'
  expect: answer
  tools: [convert_unit]
  question: 'Wilo-WR 泵出水管路名义直径为 150 时，轴封水量是多少？折合每分钟多少升？'
  reference: '按 Wilo-WR 泵的监控表，出水管路名义直径 125~200 对应的轴封水量为 0.20 m³/h（高于出口压力 0.5bar），折合约 3.33 L/min。'
  facts:
    - say: 轴封水量 0.20 m³/h
      any: ['{n:0.2}m3/h', '{n:0.2}立方米']
      numeric: true
    - say: 折合约 3.33 L/min
      any: ['{n:3.3}(l/min|lpm|升)', '{n:3.33}(l/min|lpm|升)', '{n:3.333}(l/min|lpm|升)']
      numeric: true
      calc: '0.2*1000/60'
  evidence:
    - quote: '125~200 0.20'

- id: cv_02
  type: convert
  doc: '2'
  expect: answer
  tools: [convert_unit]
  question: 'Wilo-WR 泵 GGG 壳体的最大承压是多少？换算成 MPa 和 psi 分别是多少？'
  reference: 'GGG 壳体的水泵最大承压为 40 bar（介质温度 0℃～+100℃），即 4 MPa，约 580 psi。'
  facts:
    - say: 最大承压 40 bar
      any: ['{n:40}bar']
      numeric: true
    - say: 4 MPa
      any: ['{n:4}mpa']
      numeric: true
      calc: '40*0.1'
    - say: 约 580 psi
      any: ['{n:580}psi', '{n:580.2}psi', '{n:580.15}psi']
      numeric: true
      calc: '40*14.5037738'
  evidence:
    - quote: 'GG GGG 25 40'

- id: cv_03
  type: convert
  doc: '1'
  expect: answer
  tools: [convert_unit]
  question: 'D 型泵运转时，水泵轴承最高温度不应超过多少？用华氏度表示是多少？'
  reference: 'D 型泵运转时水泵轴承最高温度不应超过 75℃，即 167°F。'
  facts:
    - say: 不超过 75℃
      any: ['{n:75}{C}']
      numeric: true
    - say: 167°F
      any: ['{n:167}{F}', '华氏{n:167}度']
      numeric: true
      calc: '75*9/5+32'
  evidence:
    - quote: '水泵轴承最高温度不应超过75℃'

- id: cv_04
  type: convert
  doc: '4'
  expect: answer
  tools: [convert_unit]
  question: 'Model 3700 的冷却水压力最高不能超过多少？换算成 MPa 大约是多少？'
  reference: '冷却水压力不要超过 7.0 kg/cm²（100 psig），约 0.69 MPa。'
  facts:
    - say: 不超过 7.0 kg/cm²（100 psig）
      any: ['{n:7}kgf?/cm2', '{n:100}psi']
      numeric: true
    - say: 约 0.69 MPa
      any: ['{n:0.7}mpa', '{n:0.69}mpa', '{n:0.686}mpa', '{n:0.689}mpa', '{n:0.6865}mpa', '{n:0.6895}mpa']
      numeric: true
      calc: ['7*0.0980665', '100*0.00689476']
  evidence:
    - quote: '冷却水压力不要超过 7.0 kg'

- id: cv_05
  type: convert
  doc: '4'
  expect: answer
  tools: [convert_unit]
  question: 'Model 3700 采用外部冲洗时，冲洗液的注入速率要求是多少？换算成 m³/h 是多少？'
  reference: '注入速率必须介于 2 到 8 lpm（0.5 到 2 gpm）之间，即 0.12 到 0.48 m³/h。'
  facts:
    - say: 2 到 8 lpm（0.5 到 2 gpm）
      any: ['{n:2}(l/min|lpm|升/分)?{to}{n:8}(l/min|lpm|升/分)', '{n:2}{to}8 1pm', '{n:0.5}{to}{n:2}gpm']
      numeric: true
      src: '2 到 8 1pm'
    - say: 0.12 到 0.48 m³/h
      any: ['{n:0.12}(m3/h|立方米)?{to}{n:0.48}(m3/h|立方米)', '{n:0.11}(m3/h|立方米)?{to}{n:0.45}(m3/h|立方米)',
            '{n:0.114}(m3/h|立方米)?{to}{n:0.454}(m3/h|立方米)']
      numeric: true
      calc: ['2*60/1000', '8*60/1000', '0.5*0.227125', '2*0.227125']
  evidence:
    - quote: '注入速率必须介于 2 到 8'

- id: cv_06
  type: convert
  doc: '1'
  expect: answer
  tools: [convert_unit]
  question: 'D 型泵改为外冲洗结构时，冲洗水压力至少要比泵进口压力高多少？折合多少 kgf/cm²？'
  reference: '冲洗水压力应 ≥ 泵进口压力 + 0.2 MPa（首级双吸结构时 ≥ 泵单级扬程 + 进口压力 + 0.2 MPa）；0.2 MPa 约合 2.04 kgf/cm²。'
  facts:
    - say: 至少高 0.2 MPa
      any: ['{n:0.2}mpa']
      numeric: true
    - say: 约 2.04 kgf/cm²
      any: ['{n:2}(kgf|kg)/cm2', '{n:2.04}(kgf|kg)/cm2', '{n:2.039}(kgf|kg)/cm2', '{n:2.04}公斤', '{n:2.039}公斤']
      numeric: true
      calc: '0.2/0.0980665'
  evidence:
    - quote: '压力：≥泵进口压力+0.2MPa'

- id: cv_07
  type: convert
  doc: '2'
  expect: answer
  tools: [convert_unit]
  question: 'Wilo-WR 出水管路的最大流速是多少？换算成英尺每秒是多少？'
  reference: '出水管路最大流速为 2.5 m/s（注意压差），约 8.2 ft/s。'
  facts:
    - say: 最大流速 2.5 m/s
      any: ['{n:2.5}m/s', '2\. 5m/s']
      numeric: true
      src: '2. 5m/s'
    - say: 约 8.2 ft/s
      any: ['{n:8.2}(ft/s|英尺)', '{n:8.20}(ft/s|英尺)', '{n:8.202}(ft/s|英尺)']
      numeric: true
      calc: '2.5/0.3048'
  evidence:
    - quote: '最大流速 2. 5m/s'

- id: cv_08
  type: convert
  doc: '4'
  expect: answer
  tools: [lookup_table, convert_unit]
  question: 'Model 3700 泵壳螺栓（项目 356A）规格为 5/8 英寸 UNC 时，拧紧扭矩是多少？折合多少 kgf·m？'
  reference: '泵壳螺栓 356A、5/8 英寸 UNC 的扭矩为 176 N·m（130 英尺-磅），约 17.9 kgf·m。'
  facts:
    - say: 176 N·m（130 英尺-磅）
      any: ['{n:176}(nm|n·m|n\.m|n-m|牛)', '{n:130}(英尺|ft|lb)']
      numeric: true
    - say: 约 17.9 kgf·m
      any: ['{n:18}kg', '{n:17.9}kg', '{n:17.95}kg', '{n:17.947}kg', '{n:18.0}kg', '{n:17.97}kg']
      numeric: true
      calc: ['176/9.80665', '130*0.138255']
  evidence:
    - quote: '176 Nm130英尺-磅'

# ============================================================================ 限值核对

- id: ck_01
  type: check
  doc: '1'
  expect: answer
  tools: [check_value]
  question: 'D 型泵运行中测得轴承温度 78℃，是否超过手册规定？'
  reference: '超过了手册规定。D 型泵运转时水泵轴承最高温度不应超过 75℃，78℃ 高出 3℃。'
  facts:
    - say: 限值 75℃
      any: ['{n:75}{C}']
      numeric: true
    - say: 结论：超过
      any: &exceed
        - '(?<![未没不])超(过|出)了?(手册|规定|允许|上限|最高|限值|要求|范围|标准|最大|额定)'
        - '(已|已经|确实|明显|也)超(过|出)'
        - '超(标|限)'
        - '(高|大)(出|于)了?(上限|限值|规定|允许|最大|手册|最高|正常|要求)'
        - '不(合格|符合|满足)'
        - '不在.{0,8}范围'
        - '不可以|不能(用|使用)|不宜(使用|用)|不允许(使用|用)'
  evidence:
    - quote: '水泵轴承最高温度不应超过75℃'

- id: ck_02
  type: check
  doc: '1'
  expect: answer
  tools: [check_value]
  question: 'MD 型泵用来输送固体颗粒体积浓度为 2% 的矿井水，符合手册要求吗？'
  reference: '不符合。MD 型煤矿用耐磨多级离心泵用于输送固体颗粒含量（体积浓度）不大于 1.5% 的中性矿井水，2% 超出了上限。'
  facts:
    - say: 限值不大于 1.5%
      any: ['{n:1.5}%']
      numeric: true
    - say: 结论：不符合
      any: *exceed
  evidence:
    - quote: '固体颗粒含量(体积浓度)不大于1.5%'

- id: ck_03
  type: check
  doc: '2'
  expect: answer
  tools: [check_value]
  question: 'Wilo-WR 泵用百分表对中，测得径向跳动 0.08mm，合格吗？'
  reference: '合格。手册规定径向最大跳动 0.10mm（最佳值 0.05mm），0.08mm 在允许范围内，但没有达到最佳值。'
  facts:
    - say: 径向最大跳动 0.10mm
      any: ['{n:0.1}{mm}']
      numeric: true
    - say: 结论：合格
      any: &within
        - '(?<![不否])(合格|符合|满足)'
        - '(?<!不)在.{0,10}(范围|允许值|要求|规定)(之)?内'
        - '(未|没有|没)超(过|出)'
        - '低于(上限|限值|最大|允许|规定)'
  evidence:
    - quote: '径向最大跳动 0.10mm'

- id: ck_04
  type: check
  doc: '2'
  expect: answer
  tools: [check_value]
  question: 'GG 壳体的 Wilo-WR 泵，用在工作压力 2.8 MPa 的系统里可以吗？'
  reference: '不可以。GG 壳体的水泵最大承压为 25 bar（即 2.5 MPa，介质温度 0℃～+100℃），2.8 MPa（28 bar）超出了最大承压。'
  facts:
    - say: GG 壳体最大承压 25 bar（2.5 MPa）
      any: ['{n:25}bar', '{n:2.5}mpa']
      numeric: true
    - say: 结论：不可以
      any: *exceed
  evidence:
    - quote: 'GG GGG 25 40'

- id: ck_05
  type: check
  doc: '4'
  expect: answer
  tools: [check_value]
  question: 'Model 3700 运行中测得轴承温度 190°F，在手册给出的正常范围内吗？'
  reference: '不在。手册规定绝大多数工作条件下轴承温度应介于 49°C（120°F）和 82°C（180°F）之间，190°F 高于上限 180°F；轴承温度超过 82°C（180°F）时应使用 ISO 粘度级别 100 的润滑油。'
  facts:
    - say: 正常范围上限 82°C（180°F）
      any: ['{n:180}{F}', '{n:82}{C}']
      numeric: true
    - say: 结论：超出范围
      any: *exceed
  evidence:
    - quote: '轴承温度应该介于 49°C | 120°F 和 82°C | 180°F'

- id: ck_06
  type: check
  doc: '4'
  expect: answer
  tools: [check_value, convert_unit]
  question: 'Model 3700 采用外部冲洗时，冲洗液压力比密封腔压力高 0.5 bar，满足手册要求吗？'
  reference: '满足。手册要求冲洗液压力比密封腔压力高出 0.35 到 1.01 kg/cm²（5 到 15 psi）；0.5 bar 约合 0.51 kg/cm²（7.25 psi），在要求范围内。'
  facts:
    - say: 要求高出 0.35 到 1.01 kg/cm²（5 到 15 psi）
      any: ['{n:0.35}(kgf?/cm2)?{to}{n:1.01}', '{n:5}(psi)?{to}{n:15}psi']
      numeric: true
    - say: 0.5 bar 约合 0.51 kg/cm²（7.25 psi）
      any: ['{n:0.51}(kgf|kg)/cm2', '{n:0.5099}(kgf|kg)/cm2', '{n:0.51}公斤', '{n:7.25}psi', '{n:7.3}psi', '{n:7.252}psi']
      numeric: true
      calc: ['0.5/0.980665', '0.5*14.5037738']
    - say: 结论：满足
      any: *within
  evidence:
    - quote: '高出 0.35 到 1.01 kg'

- id: ck_07
  type: check
  doc: '4'
  expect: answer
  tools: [check_value]
  question: 'Model 3700 最终校准时，工作温度下千分表的总读数（T.I.R.）测得 0.003 英寸，校准合格吗？'
  reference: '不合格。手册要求工作温度下千分表总读数（T.I.R.）为 0.05 毫米（0.002 英寸）或更低，0.003 英寸超出了要求。'
  facts:
    - say: 要求 0.002 英寸（0.05 毫米）或更低
      any: ['{n:0.002}{in}', '{n:0.05}{mm}']
      numeric: true
    - say: 结论：不合格
      any: *exceed
  evidence:
    - quote: '为 0.05 毫米 | 0.002 英寸或更低'

- id: ck_08
  type: check
  doc: '2'
  expect: answer
  tools: [lookup_table, check_value]
  question: 'Wilo-WR 爪型联轴器外径 200mm，测得两个半联轴节端面间距为 7mm，符合要求吗？'
  reference: '不符合。外径 160～225mm 的爪型联轴器，两半联轴节端面间距 c 应为 2～6mm，7mm 超出了上限。'
  facts:
    - say: 间距 c 应为 2～6mm
      any: ['{n:2}({mm})?{to}{n:6}{mm}']
      numeric: true
    - say: 结论：不符合
      any: *exceed
  evidence:
    - quote: '160~225mm 2~6mm'

# ============================================================================ 表格精确查询

- id: tb_01
  type: table_lookup
  doc: '4'
  expect: answer
  tools: [lookup_table]
  question: 'Model 3700 的零件编号 184 是什么零件？'
  reference: '零件编号 184 是密封腔盖。'
  facts:
    - say: 184 是密封腔盖
      any: ['{n:184}.{0,8}密封腔盖', '密封腔盖.{0,8}{n:184}']
      numeric: true
  evidence:
    - quote: '184 密封腔盖'

- id: tb_02
  type: table_lookup
  doc: '4'
  expect: answer
  tools: [lookup_table]
  question: 'Model 3700 的泵轴对应的零件编号是多少？'
  reference: '泵轴的零件编号是 122。'
  facts:
    - say: 泵轴编号 122
      any: ['泵轴.{0,10}{n:122}', '{n:122}.{0,6}泵轴']
      numeric: true
  evidence:
    - quote: '122 泵轴'

- id: tb_03
  type: table_lookup
  doc: '2'
  expect: answer
  tools: [lookup_table]
  question: 'Wilo-WR 零件清单中，叶轮和轴的零件号分别是多少？'
  reference: '叶轮的零件号是 230，轴的零件号是 210。'
  facts:
    - say: 叶轮 230
      any: ['叶轮.{0,10}{n:230}', '{n:230}.{0,6}叶轮']
      numeric: true
    - say: 轴 210
      any: ['(?<![叶长])轴(?!承|套).{0,10}{n:210}', '{n:210}.{0,6}轴']
      numeric: true
  evidence:
    - quote: '210 轴'
    - quote: '230 叶轮'

- id: tb_04
  type: table_lookup
  doc: '4'
  expect: answer
  tools: [lookup_table]
  question: '按 Model 3700 的运行故障排除表，机械密封严重泄漏可能有哪些原因？'
  reference: '原因有：填料密封接头调节不当；填料函填料不当；机械密封部件磨损；机械密封过热；泵轴或泵轴套管上有刻痕。'
  facts:
    - say: 填料密封接头调节不当
      any: ['接头调节不当', '接头.{0,4}调(节|整)']
    - say: 填料函填料不当
      any: ['填料函.{0,4}填料不当', '填料不当']
    - say: 机械密封部件磨损
      any: ['部件磨损', '密封.{0,6}磨损']
    - say: 机械密封过热
      any: ['密封.{0,4}过热']
    - say: 泵轴或轴套上有刻痕
      any: ['刻痕', '划痕']
  evidence:
    - quote: '机械密封严重泄漏'

- id: tb_05
  type: table_lookup
  doc: '4'
  expect: answer
  tools: [lookup_table]
  question: 'Model 3700 运行时电机所需电力过大，故障排除表列出了哪些原因？'
  reference: '原因有：排放扬程低于额定点且抽运过多的液体；液体比预期更重；填料函填料过紧；转动部件相互摩擦；叶轮间隙过小。'
  facts:
    - say: 排放扬程低于额定点、抽运液体过多
      any: ['扬程低于额定', '抽运过多']
    - say: 液体比预期更重
      any: ['比预期.{0,2}重', '比重']
    - say: 填料函填料过紧
      any: ['填料.{0,4}过紧']
    - say: 转动部件相互摩擦
      any: ['相互摩擦', '部件.{0,4}摩擦']
    - say: 叶轮间隙过小
      any: ['叶轮间隙过小', '间隙过小']
  evidence:
    - quote: '电机所需电力过度'

- id: tb_06
  type: table_lookup
  doc: '3'
  expect: answer
  tools: [lookup_table]
  question: 'Leader Ecoplus 泵过热保护开启、因过热停止，可能有哪些原因？'
  reference: '原因有：电源与电机铭牌所载规格不一致（电压过高或过低）；叶轮被固体堵塞；泵的水温过高；泵空转或在输送龙头关闭的情况下运行时间过长。处理方法：拔下插头，消除导致过热的因素，等电机冷却后再启动。'
  facts:
    - say: 电源与铭牌规格不一致（电压过高或过低）
      any: ['铭牌', '电压过(高|低)']
    - say: 叶轮被固体堵塞
      any: ['叶轮.{0,6}堵塞']
    - say: 水温过高
