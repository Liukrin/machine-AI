# 机械设备运维知识问答 RAG 平台 —— 项目配置（S1 解析 → S5 服务，以及各评测脚本）
# 所有路径与参数一律从本文件读取，脚本内不得硬编码。

s1_ingest:
  # MinerU 参数（pipeline 后端，CPU）
  mineru:
    backend: pipeline          # pipeline（CPU 友好）| vlm
    device: cpu                # 推理设备
    # 首次运行自动下载模型，下载目录由 MinerU 决定（见 --models 说明）
    language: zh

  # 路径
  raw_pdf_dir: data/raw_pdf        # 输入：待解析 PDF 目录
  parsed_md_dir: data/parsed_md    # 输出：每本 PDF 一个子目录（{文件名}/）
  blocks_jsonl: data/parsed_md/blocks.jsonl   # 任务二结构化输出
  qc_report_md: eval/reports/s1_qc.md         # 任务三质检报告

  # 后处理规则
  postprocess:
    header_footer_max_occurrence: 0.5   # 某行文本出现页数占比 >= 该阈值 -> 判定为页眉/页脚
    min_block_chars: 10                  # 正文块最小字数（小于则视为噪音，任务三列入空/短块）
    max_block_chars: 2000                # 正文块最大字数（超过则列为超长 block）

s2_clean:
  # 输入输出（S2 任务一：只清洗不合并、不切分）
  input_jsonl: data/parsed_md/blocks.jsonl      # 输入：S1 产物
  output_jsonl: data/chunks/blocks_clean.jsonl  # 输出：干净块

  # 清洗规则参数（规则按下方 1~6 顺序执行，命中即删除/清洗，不再进入后续规则）
  #   1 drop_empty          text/table_html/img_path 三者皆空 -> 删
  #   2 strip_control       剔除 \x00 等不可见字符；剔后为空 -> 删，否则保留清洗文本
  #   3 drop_toc            单块内 "." 或 "…" 出现 >= toc_dot_min 次 -> 删
  #   4 drop_pure_symbol    去掉标点空白后无中英文数字 -> 删
  #   5 drop_empty_table    table_html 空且无 img_path 的 table 块 -> 删
  #   6 keep_short          过短块（char_len < min_block_chars）保留，不删
  toc_dot_min: 20                 # 目录页判定阈值
  min_block_chars: 10             # 过短块保留阈值（任务二合并）

s2_chunk:
  # 输入输出（S2 任务二：合并碎块成 chunk，只合并不向量化）
  input_jsonl: data/chunks/blocks_clean.jsonl
  output_jsonl: data/chunks/chunks.jsonl
  target_chars: 400                # 累计 char_len 达到即封一个 chunk
  max_chars: 800                   # 超过强制封块
  overlap_blocks: 1                # 相邻 chunk 重叠的源块数
  min_body_chars: 30               # 修正2：正文(去前缀)char_len < 该值 -> 丢弃 chunk
  contact_hits_min: 2              # 修正4：正文同时命中 >= 该数目的联系方式特征 -> 丢弃 chunk

s2_vector:
  # 输入输出（S2 任务三：embedding + Chroma 向量库）
  input_jsonl: data/chunks/chunks.jsonl
  chroma_dir: chroma_db/                 # Chroma 持久化目录
  collection_name: equipment_manual      # collection 名
  model_path: models/bge-small-zh-v1.5   # 本地 embedding 模型
  device: cpu                            # 推理设备
  normalize_embeddings: true             # 向量归一化
  batch_size: 32                         # 批量入库大小

s3_retrieval:
  # 【最终采用方案】BM25 + 向量混合检索（RRF 融合），S3 实测结论见 eval/reports/s3_summary.md
  qa_set: eval/qa_set.jsonl
  bm25_index: data/chunks/bm25_index.pkl   # BM25 索引缓存
  report: eval/reports/s3_hybrid.md
  top_k: 10               # 最终输出 top_k
  per_path_top: 20        # 两路各取 top_20 再融合
  rrf_k: 60               # RRF 融合常数 k

s3_rerank:
  # 输入输出（S3 任务五：混合召回 + CrossEncoder 精排，三方对比）
  qa_set: eval/qa_set.jsonl
  report: eval/reports/s3_rerank.md
  rerank_model: models/bge-reranker-base   # 本地 rerank 模型
  batch_size: 16           # CrossEncoder 打分 batch
  top_k: 10                # 精排后输出 top_k
  per_path_top: 20         # 混合召回 top_20
  rrf_k: 60                # RRF 融合常数 k
  # 弃用原因：
  #   实测 rerank 提升 hard/table 的 R@10（+0.20/+0.14），
  #   但总体 R@1 从 0.778 跌至 0.639，7 条原本排第 1 的正文题被降权；
  #   且单题多耗 3.07s。
  #   本项目语料 text 占多数，全局 rerank 净亏，故弃用。
  #   模型与脚本保留，可随时置 true 复现。
  enabled: false

# 系统提示词：三个版本只差引用条款这一行，对照实验见 eval/halluc_ab/summary.md。
# 线上用哪一版由 s4_agent.system_prompt 指定；评测脚本读同一批文件，改文件内容会被其漂移自检与哈希复用校验发现。
# 文件按原样读取（不 strip）：评测按文件字节算 prompt_hash，B 文件末尾无换行，以与历史记录的哈希保持一致。
prompts:
  A: configs/prompts/A_no_citation.txt            # 无引用标注要求（对照组）
  B: configs/prompts/B_end_citation.txt           # 答案末尾标注引用（切换前的线上版本）
  C: configs/prompts/C_per_sentence_citation.txt  # 每一句末尾标注引用（rag 模式在用的版本）
  agent: configs/prompts/agent.txt                # 工具调用 Agent 的系统提示词（{catalog} 处填手册清单）
  mcp: configs/prompts/mcp.txt                    # MCP Server 的使用说明（握手时发给客户端，{catalog} 处填手册清单）

s4_agent:
  # rag 模式（固定流水线：检索 → 拒答闸 → 生成 → 引用校验）的参数，graph.py 与 api.py 共用；
  # 这是阶段 1 答案级评测的基线系统。tau_distance 也被 agent 模式用来标注「检索相关度低」。
  system_prompt: C   # prompts 段的版本 key
  top_k: 5           # 送入 LLM 的检索片段数（检索选型评测用 top_k=10，见 s3_retrieval）
  # 单次回答生成上限（原 500）。经 extra_body 以 max_tokens 字段发给 DeepSeek：langchain-openai 1.x 会把
  # max_tokens 参数改名为 max_completion_tokens，DeepSeek 不识别，此前的 500 实际从未生效（见 llm_config.py）。
  # 取值依据：实测 output tokens 分布与 finish_reason 统计见 eval/reports/s5_perf.md。
  max_tokens: 1024
  # 拒答闸一：向量 top-1 cosine distance 阈值（> 判为知识库无相关内容）
  # 标定：36 条正样本 distance 的 P95 = 0.3567；6 条负样本 min = 0.3347（挖掘机液压泵，语义相邻）。
  # 两者重叠（无清晰间隔），按规则取正样本 P95。
  # 注意：36 条正样本就是 eval/qa_set.jsonl 本身，在同一批题上取 P95，线性插值下必然恰有 2 题（qa_002、qa_018）高于阈值；
  # 5.6% 的误拒率由阈值定义决定，不是独立测试集上测得的结果。
  tau_distance: 0.3567

agent:
  # 工具调用 Agent（src/s4_agent/agent.py，LangGraph 图：预检索 → 模型 ⇄ 工具 → 引用校验）。
  # /api/ask 默认走这里；请求里 mode=rag 时走上面 s4_agent 段的固定流水线。
  default_mode: agent        # 请求不指定 mode 时用哪种：agent | rag
  system_prompt: agent       # prompts 段的版本 key
  max_tokens: 1024           # 单次模型调用的生成上限（与 rag 模式相同）
  max_tool_rounds: 3         # 模型最多发起几轮工具调用，之后强制作答：每题最多 4 次模型调用
  max_calls_per_round: 4     # 一轮里最多执行几个工具调用，多出的不执行、作为错误回给模型
  tool_timeout_s: 10         # 单个工具的超时（秒），超时作为错误回给模型
  search_top_k: 5            # search_manuals 每次返回的片段数（与 rag 模式的 top_k 相同）
  lookup_max_rows: 12        # lookup_table 最多列出的命中行数
  history_turns: 3           # 带上最近几轮对话（一问一答算一轮）
  history_answer_chars: 600  # 每条历史回答去掉引用标记后最多保留的字数
  # 拒答判定：回答含这些话术且没有引用任何片段（与答案级评测、前端同一口径）
  refusal_markers: [检索内容不足, 知识库无相关内容, 无法回答, 未能找到相关]

# 单题成本估算用的模型单价（元/百万 tokens）。DeepSeek 官网 2026-09-30 的价格：
# 模型为 deepseek-flash（V4.1-Flash，非思考模式，见 src/llm_config.py），按 Flash 价格估算；
# 取高峰时段价格作为上限（空闲时段为一半）。https://api-docs.deepseek.com/zh-cn/quick_start/pricing
llm_pricing:
  input_cache_hit: 0.04
  input_cache_miss: 2.0
  output: 8.0

s5_app:
  # 允许跨域的前端地址（开发时前端走 Vite 代理、同源访问，用不到；直接从其他端口访问 API 时才需要）
  cors_origins:
    - http://localhost:5173
  # 前端展示用的文档信息（来源卡片、知识库范围）；key 为 doc_id（= data/raw_pdf 下的文件名）
  #   title 完整名称（来源详情）；short 简称（来源卡片）；sample 自造示例手册，前端会显式标注
  documents:
    "1":
      title: D型 / MD型 / DF型卧式多级离心泵安装使用说明书
      short: D/MD/DF 型多级离心泵
    "2":
      title: Wilo-WR 系列多级离心泵安装使用说明书
      short: Wilo-WR 多级离心泵
    "3":
      title: Leader 离心泵（Ecotronic / Ecojet / Ecoplus 系列）
      short: Leader 离心泵
    "4":
      title: Model 3700（API 610 OH2）安装、运行与维护手册
      short: Model 3700 维护手册
    sample_cooler_manual:
      title: 板式冷却器维护手册（自造示例）
      short: 板式冷却器（示例）
      sample: true
    sample_pump_manual:
      title: 液压齿轮泵检修规程（自造示例）
      short: 液压齿轮泵（示例）
      sample: true
    sample_valve_manual:
      title: 电磁换向阀故障排查手册（自造示例）
      short: 电磁换向阀（示例）
      sample: true

s5_perf:
  # 端到端性能与 Token 成本评测（src/s5_eval/perf_bench.py）
  # 直连 graph 节点函数与 llm.stream，不起 HTTP 服务。
  # 提示词版本与 max_tokens 直接取线上值（s4_agent 段），报告头会写明。
  qa_set: eval/qa_set.jsonl            # 复用检索评测同一套题（36 题，全部来自真实手册）
  report: eval/reports/s5_perf.md      # 输出报告（分段耗时 / 端到端 / token / 占比四张表）
  warmup_runs: 1                       # 预热次数（走完整正常路径，结果丢弃，排除 _load_ctx/jieba/连接冷启动）
  repeat: 1                            # 每题重复计时次数（>1 时统计合并所有轮次）
  encode_measure_runs: 30              # 单次 model.encode(单句) 耗时测量次数，取中位数（量化重复编码冗余）
  # 拒答路径专用库外问题（占位 3 条，需与知识库语义足够远才能触发拒答闸）；
  # 若实测 distance ≤ tau 走了生成路径，bench 如实记录实际路径，不强制拒答。
  reject_questions:
    - 明天北京天气怎么样            # 占位：与泵手册语义无关，可按需替换
    - 如何做红烧肉                  # 占位：同上
    - 股票基金怎么选                # 占位：同上

# ---------------------------------------------------------------------------
# S4 补充实验：引用标注对照评测（src/s4_eval/halluc_ab_eval.py，脚本名沿用早期「幻觉抑制」的叫法）
#   目标：量化提示词里的引用条款对「无引用句占比」的影响，并检出虚构的 chunk_id。
#        该指标衡量引用标注有没有覆盖到每一句（指令遵循），不衡量所引片段是否真的支持该句，也不衡量答案对错。
#   设计：36 题各跑一次检索并落盘缓存，A/B/C 各组读同一份缓存，只换系统提示词；
#        temperature 固定，各组共用，杜绝检索与解码带来的额外变量。
#   三组提示词读顶层 prompts 段的同一批文件（线上用哪一版见 s4_agent.system_prompt）。
# ---------------------------------------------------------------------------
s4_halluc_ab:
  # 输入输出
  qa_set: eval/qa_set.jsonl
  retrieval_cache: eval/halluc_ab/retrieval_cache.jsonl   # 检索缓存（跑一次，两组共享）
  retrieval_meta: eval/halluc_ab/retrieval_cache.meta.json # 缓存指纹，参数变了会显式报错
  answers_raw: eval/halluc_ab/answers_raw.jsonl           # 逐题原始答案落盘，便于离线复算指标
  detail_csv: eval/halluc_ab/details.csv                  # 明细：一行一题一组
  summary_md: eval/halluc_ab/summary.md                   # 汇总表落盘（同时打印 stdout）

  # 漂移自检以 B 组为基准：
  #   A 组（对照）= B 删掉第 2 条「答案末尾必须标注引用的 chunk_id」，其余行原文照抄（保留 1/3/4 原编号，不重编号）；
  #   C 组（逐句标注变体）= B 仅把该条替换为「每一句末尾标注」，其余行原文照抄；
  #   C 组用于消除「答案末尾标注」与逐句评测口径的错配（B 组残值的主因）。
  citation_drop_pattern: "必须标注引用"   # 漂移自检：A 组必须恰好少这一行
  citation_drop_lines: 1                 # 预期被删除的行数
  per_sentence_marker: 每一句            # 漂移自检：C 组唯一改动行必须包含该词

  # 默认参与组别；磁盘上已完整落盘且提示词哈希一致的组自动复用，不重复调用 LLM
  groups: [A, B, C]

  # 生成参数：实验时与当时线上一致，之后未重跑，保持原值与已落盘的答案对应（复用答案时不会重新生成）。
  # 注意：实验时 langchain-openai 把 max_tokens 改名为 max_completion_tokens 发出，DeepSeek 不识别，
  # 这里的 500 当时并未生效（2026-09-29 发现并修复，见 docs/process_log.md）；以后重新生成答案时才会真正生效。
  top_k: 5
  max_tokens: 500
  temperature: 0.0    # 确定性解码；脚本从本文件读取，不硬编码
  llm_retries: 2      # 单题 LLM 调用失败后的显式重试次数；耗尽即记失败，绝不当成功统计
  retry_sleep: 3.0    # 重试间隔（秒）

  # 指标定义 1：实质性句子判定
  min_sentence_chars: 10               # 切分后长度 < 该值的片段剔除
  transition_end_markers: ["：", ":"]  # 以冒号结尾的纯过渡/小标题句剔除
  transition_markers:                  # 命中下列说法且整句很短 -> 判为纯过渡句剔除
    - 以下是相关信息
    - 以下是检索到的
    - 相关内容如下
    - 回答如下
  transition_max_chars: 25             # 过渡句判定的长度上限（避免误删实义句）

  # 拒答判定（控制变量）：拒答闸命中（两组必然相同）+ 模型自述拒答（两组可能不同）
  refusal_markers:
    - 检索内容不足
    - 知识库无相关内容
    - 无法回答
    - 未能找到相关
  refusal_max_chars: 40   # 整句/整答去空白后长度 <= 该值且命中拒答话术 -> 判为模型自述拒答

# ---------------------------------------------------------------------------
# 答案级评测（src/answer_eval/）：评「答得对不对」，而不只是检索命中与引用格式。
#   系统输出直接取线上事件流（src/s5_app/api.py 的 _sse_events），与线上同一条代码路径；
#   关键事实、数值、拒答、证据命中由确定性代码判分，忠实度与引用是否成立由评审模型判分。
# ---------------------------------------------------------------------------
answer_eval:
  items: eval/answer_set.yaml          # 评测集（证据用手册原文引文标注，评测时解析成 chunk_id）
  split: eval/answer_set_split.json    # dev / test 划分（validate.py --assign 生成后冻结）
  out_dir: eval/answer_eval            # 每次评测一个子目录：<out_dir>/<评测名>/
  run: baseline                        # 默认评测名；系统改动后用 --run 换名另存，便于前后对比
  # 其他评测集（run.py / validate.py 用 --set 选择），结果放在 <out_dir>/<评测名>/<集名>/
  sets:
    tasks:
      title: Agent 多步任务集
      items: eval/agent_tasks.yaml       # 单位换算、限值核对、表格精确查询、多步/跨手册，外加手册没写的参数
      split: eval/agent_tasks_split.json

  # 模型自述拒答的话术（与前端、s4_halluc_ab 同一组）。判定：命中话术且答案里没有引用任何片段。
  refusal_markers:
    - 检索内容不足
    - 知识库无相关内容
    - 无法回答
    - 未能找到相关

  # 评审模型（与生成模型相同，见 src/answer_eval/judge.py 的约束措施）
  judge:
    temperature: 0.0
    max_tokens: 2000        # 评审输出（JSON）上限；被截断按失败处理
    retries: 2              # 调用失败或输出结构不对时的重试次数；耗尽记为失败，不当成通过
    retry_sleep: 3.0
    concurrency: 6          # 评审任务并发数（被测系统本身是逐题串行调用的，以免影响耗时统计）
    faithfulness_prompt: configs/prompts/judge_faithfulness.txt   # 逐句：有没有片段依据、引用是否成立
    facts_prompt: configs/prompts/judge_facts.txt                 # 逐条：关键事实是否答出
